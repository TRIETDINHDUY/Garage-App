spring.application.name=garage-management

# H2 File-Based Database (persists to disk, console accessible in browser)
spring.datasource.url=jdbc:h2:file:./data/garagedb;AUTO_SERVER=true
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console — open http://localhost:8080/h2-console in browser
# JDBC URL to enter in console: jdbc:h2:file:./data/garagedb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Initialize data.sql after schema created by Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server
server.port=8090
