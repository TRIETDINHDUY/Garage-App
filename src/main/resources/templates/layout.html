<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' — Garage Manager' : 'Garage Manager'}">Garage Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f0f2f5; }
        .navbar { background: #1a3a5c !important; }
        .navbar-brand { color: #fff !important; font-weight: 700; font-size: 1.3rem; letter-spacing: .5px; }
        .navbar-brand i { color: #f5a623; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .table thead { background: #1a3a5c; color: #fff; }
        .badge-received  { background: #0d6efd; }
        .badge-in_progress { background: #fd7e14; }
        .badge-completed { background: #198754; }
        a.row-link { text-decoration: none; color: inherit; }
        tr:hover { background: #e8f0fe; cursor: pointer; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-tools me-2"></i>Garage Manager
        </a>
    </div>
</nav>

<div class="container">
    <div th:replace="~{:: #page-content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
